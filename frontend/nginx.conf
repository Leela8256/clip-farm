server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # /episode?id=… → episode.html; unknown paths fall back to the app shell
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
