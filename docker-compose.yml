# The whole app is the static frontend: every processing step runs on the
# RocketRide engine, which you start on the host (see README.md). The browser
# talks to the engine directly, so the container only needs to know where the
# engine is reachable *from the browser* (build-time NEXT_PUBLIC_* values).
#
#   docker compose up -d --build
#   open http://localhost:3000

services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_ROCKETRIDE_URI: ${NEXT_PUBLIC_ROCKETRIDE_URI:-http://127.0.0.1:5567}
        NEXT_PUBLIC_ROCKETRIDE_APIKEY: ${NEXT_PUBLIC_ROCKETRIDE_APIKEY:-MYAPIKEY}
    restart: unless-stopped
    ports:
      - "3000:3000"
