# Production variant — no bind-mounts (code is baked into images), restart
# policies, and a resource limit on the worker (Whisper transcription is
# memory-heavy; see AGENTS.md's "Celery worker concurrency is 1 prefetch").
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# (layers on top of the base file — Redis/Postgres/networking are unchanged;
# this only overrides api/worker and adds the frontend service.)
#
# Out of scope for this file (see AGENTS.md "What is not in scope for v1"):
# TLS termination, a reverse proxy, secrets management beyond .env, and
# horizontal scaling beyond a single worker replica.

services:
  postgres:
    restart: unless-stopped
    ports: !reset []

  redis:
    restart: unless-stopped
    ports: !reset []

  api:
    restart: unless-stopped
    volumes: !reset
      - ./assets:/app/assets
      - tmp-data:/app/tmp
    extra_hosts: !reset []

  worker:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
    volumes: !reset
      - ./assets:/app/assets
      - tmp-data:/app/tmp

  frontend:
    build:
      context: ./frontend
      args:
        API_ORIGIN: http://api:8000
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
